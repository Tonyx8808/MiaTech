<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Flexbox - Centrare sul Cross Axis</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>

  <h1>Flexbox - Centrare gli elementi sul Cross Axis</h1>

  <section>
    <h2>Flex-direction: row</h2>
    <p>Gli elementi sono in riga e sono centrati verticalmente (cross axis).</p>
    <div class="contenitore row">
      <div class="box">Uno</div>
      <div class="box">Due</div>
      <div class="box">Tre</div>
    </div>
  </section>

  <section>
    <h2>Flex-direction: column</h2>
    <p>Gli elementi sono in colonna e sono centrati orizzontalmente (cross axis).</p>
    <div class="contenitore column">
      <div class="box">Uno</div>
      <div class="box">Due</div>
      <div class="box">Tre</div>
    </div>
  </section>

</body>
</html>
