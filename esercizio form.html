<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESERCIZIO FORM</title>
</head>
<body>
  <form action="https://www.esempio.com/invia-dati">
    <div>
    <label for="nome">NOME</label>
    <input type="text" id="name" name="nome" required>
    </div>
     <label for="cognome">COGNOME</label>
    <input type="text" id="cognome" name="cognome" required>
    <div>
     <label>Genere:</label>
    </div>
     <div>
  <input type="radio" id="maschio" name="genere" value="maschio" required>
  <label for="maschio">Maschio</label>
     </div>
     <div>
  <input type="radio" id="femmina" name="genere" value="femmina" required>
  <label for="femmina">Femmina</label>
  </div>
  <label for="numero di telefono">NUMERO DI TELEFONO</label>
  <input type="number" ID="numero di telefono" name="numero di telefono" required>
  <div><label for="email">email</label>
    <input type="text" id="email" name="email" required>
</div>
  
  <div>
  <label for="descrizione">Descrizione:</label>
  </div>
  <textarea id="descrizione" name="descrizione" rows="5" cols="30"></textarea>
  <!-- altri campi del form -->
   <div>
  <input type="checkbox" id="privacy" name="privacy" required>
  <label for="privacy">Accetto la <a href="privacy-policy.html">Privacy Policy</a></label>
   </div>
   <div>
     <!-- campi del form -->
  <button type="submit">SUBMIT</button>

   </div>
</form>


    
  </form>
</body>
</html>
