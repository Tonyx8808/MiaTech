<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ereditarietà</title>
  <link rel="stylesheet" href="style.css2.css">
</head>
<body>
  <!--prima eredità con il div verde-->
  <div class="verde">
    <h2>SEZIONE VERDE</h2>
    <p>questo è un paragrafo ereditante colore verde e testo centrato</p>
    <ul>
      <li>elemento uno</li>
      <li>elemento due</li>
    </ul>
  </div>
  <!--seconda eredità con il div blu-->
   <div class="blu">
    <h2>Sezione Blu</h2>
    <p>Questo è un paragrafo ereditante colore blu e testo a sinistra.</p>
    <ul>
      <li>Elemento tre</li>
      <li>Elemento quattro</li>
    </ul>
  </div>

</body>
</html>
