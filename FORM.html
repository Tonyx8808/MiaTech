    <section>
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>
        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" name="cognome" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label>Genere:</label>
        <input type="radio" id="maschio" name="genere" value="maschio" required>
        <label for="maschio">Maschio</label>
        <input type="radio" id="femmina" name="genere" value="femmina" required>
        <label for="femmina">Femmina</label><br><br>
        <input type="checkbox" id="termini" name="termini" required>
        <label for="termini">Accetto i termini e condizioni</label><br>
        <input type="checkbox" id="privacy" name="privacy" required>
 <label for="privacy">Accetto la privacy policy</label><br><br>
        <button type="submit">Invia</button>
      </form>
